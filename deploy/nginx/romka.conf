server {
    listen 80;
    server_name romka.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name romka.example.com;

    ssl_certificate     /etc/letsencrypt/live/romka.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/romka.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; frame-ancestors 'none'" always;

    client_max_body_size 2m;

    location /static/ { alias /opt/romka/app/app/web/static/; expires 7d; }
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;   # required for SSE streaming
        proxy_read_timeout 120s;
    }
    location /api/v1/health { proxy_pass http://127.0.0.1:8000; access_log off; }
}
