name: ROMKA CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Validate agent/skill catalogs
        run: |
          python -c "import json;[json.load(open(p,encoding='utf-8')) for p in ['app/agents/definitions.json','app/skills/catalog.json']]"
          node --check app/web/static/js/romka.js || true
      - name: Migrations (upgrade + downgrade roundtrip)
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Lint (unused/undefined names)
        run: ruff check app tests --select F401,F811,F821,F841
      - name: Tests
        env:
          ENVIRONMENT: testing
          SECRET_KEY: ci-only-secret
        run: pytest -q --cov=app --cov-report=term-missing
      - name: Dependency audit (non-blocking)
        run: |
          pip install pip-audit -q
          pip-audit || true
