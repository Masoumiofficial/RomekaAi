{% extends "base.html" %}
{% block content %}
<div class="chat-layout">
  <div class="card chat-main">
    <div class="card-h"><h2>گفتوگو با رومکا</h2>
      <div class="row"><span class="tag accent" id="chat-agents">هسته مرکزی</span>
      <button class="btn sm ghost" id="new-conv">گفتوگوی جدید</button>
      <button class="btn sm ghost" id="stream-toggle" title="دریافت جریانی">⇢ جریانی: خاموش</button></div></div>
    <div class="chat-log" id="chat-log"><div class="empty">پیامی ثبت نشده. شروع کنید.</div></div>
    <div id="chat-actions" class="row" style="padding:4px 0"></div>
    <div class="chat-input"><textarea id="chat-text" placeholder="بنویسید… (مثلاً: جلسهام دو ساعت طول کشید)"></textarea>
      <button class="btn primary" id="chat-send">ارسال</button></div>
  </div>
  <div class="stack">
    <div class="card">
      <div class="card-h"><h2>تاریخچه</h2></div>
      <div id="conv-list" class="list"></div>
    </div>
    <div class="card">
      <div class="card-h"><h2>پاسخ چگونه ساخته شد؟</h2></div>
      <div id="chat-meta" class="small muted">پس از ارسال پیام، متخصص فعال، منابع حافظه، هزینه و نقد مستقل رومکا اینجا نمایش داده میشود.</div>
    </div>
  </div>
</div>
{% endblock %}
